[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

# Celo networks
[rpc_endpoints]
celo = "https://forno.celo.org"
celo_alfajores = "https://alfajores-forno.celo-testnet.org"

# Contract verification — choose ONE, all optional (deploy works without any):
#
#   A) Blockscout (Celo's native explorer, NO API key):
#        forge verify-contract <addr> <Contract> \
#          --verifier blockscout \
#          --verifier-url https://celo.blockscout.com/api          # mainnet
#          # alfajores: https://celo-alfajores.blockscout.com/api
#
#   B) Sourcify (decentralized, NO API key):
#        forge verify-contract <addr> <Contract> --verifier sourcify
#
#   C) Celoscan/Etherscan (needs CELOSCAN_API_KEY) — uses the block below:
[etherscan]
celo = { key = "${CELOSCAN_API_KEY}", url = "https://api.celoscan.io/api", chain = 42220 }
celo_alfajores = { key = "${CELOSCAN_API_KEY}", url = "https://api-alfajores.celoscan.io/api", chain = 44787 }

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
