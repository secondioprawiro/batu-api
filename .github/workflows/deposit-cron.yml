name: BatuApi Deposit Cron

# Auto-deposit 0.001 CELO dari 100 wallet ke kontrak BatuApi (Celo mainnet).
# 4x/hari (UTC). Bisa juga dipicu manual dari tab Actions (Run workflow).
on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # 00:00 06:00 12:00 18:00 UTC
  workflow_dispatch: {}

# Jangan biarkan dua run bertumpuk (nonce wallet bisa bentrok).
concurrency:
  group: batuapi-deposit
  cancel-in-progress: false

jobs:
  deposit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        working-directory: onchain-bot
        run: npm ci

      - name: Restore wallets.json dari secret
        working-directory: onchain-bot
        env:
          WALLETS_JSON_B64: ${{ secrets.WALLETS_JSON_B64 }}
        run: |
          if [ -z "$WALLETS_JSON_B64" ]; then
            echo "::error::Secret WALLETS_JSON_B64 belum di-set."
            exit 1
          fi
          printf '%s' "$WALLETS_JSON_B64" | base64 -d > wallets.json
          node -e "const w=require('./wallets.json'); if(!Array.isArray(w.wallets)||!w.wallets.length){process.exit(1)}; console.log('wallets:', w.wallets.length)"

      - name: Run deposit
        working-directory: onchain-bot
        env:
          RPC_URL: ${{ secrets.RPC_URL }}
        run: node deposit-run.js

      - name: Hapus wallets.json (kebersihan)
        if: always()
        working-directory: onchain-bot
        run: rm -f wallets.json

      - name: Upload log run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deposit-log-${{ github.run_id }}
          path: onchain-bot/logs/deposit.log
          if-no-files-found: ignore
